schema: 1

targets:
  claude:
    enabled: true

  codex:
    enabled: true

agents:
  - architecture-guardian
  - contract-guardian
  - spec-author
  - readiness-fresh-clone
  - readiness-claim-auditor
  - readiness-test-integrity
  - readiness-security
  - readiness-reviewer-experience
  - review-principal-architect
  - review-reliability
  - review-domain-model
  - review-api-contract
  - review-data-model

rules:
  - engineering
  - spec-gated-execution
  - source-of-truth

# Declared so the compiler emits them. Before 0.2.0 it picked up everything in
# .ai/commands/ implicitly; now an undeclared command is skipped with a warning
# and its compiled copy silently freezes.
commands:
  - spec-new
  - spec-review
  - verify
