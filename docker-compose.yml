# Local orchestration for Spec-012. `docker compose up` yields a working system:
# PostgreSQL, a one-shot migrate-and-seed step, then the service.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comments_owner
      POSTGRES_PASSWORD: owner_password
      POSTGRES_DB: comments
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comments_owner -d comments']
      interval: 2s
      timeout: 3s
      retries: 20

  # Migrations run once, as the owning role, before any replica starts.
  # ADR-0009 requires one controlled runner per release rather than migration
  # on API startup.
  migrate:
    build: .
    command: sh -c 'node dist/src/migrate.js && node dist/src/seed.js'
    environment:
      DATABASE_URL: postgres://comments_owner:owner_password@postgres:5432/comments
      APP_DATABASE_PASSWORD: app_password
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    # The service connects as comments_app, which owns nothing and is therefore
    # subject to the row-level security policies (ADR-0012).
    environment:
      DATABASE_URL: postgres://comments_app:app_password@postgres:5432/comments
      PORT: '3000'
      LOG_LEVEL: info
      # The image sets NODE_ENV=production, which switches API documentation
      # off by default (Spec-011). This stack is local orchestration for
      # reviewers, not a deployment, so the documented opt-in is applied here
      # to keep /documentation reachable. A real deployment leaves it unset.
      ENABLE_API_DOCS: 'true'
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
